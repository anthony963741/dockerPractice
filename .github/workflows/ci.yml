name: Java CI with Docker

# 設定觸發條件：當你推送（push）程式碼到 main 分支時自動執行
on:
  push:
    branches: [ "main" ] # 如果你的預設分支是 master，可以改成 master

jobs:
  build:
    runs-on: ubuntu-latest # 使用 GitHub 提供的最新 Ubuntu 雲端虛擬環境

    steps:
      # 1. 把專案的程式碼抓到雲端虛擬環境中
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 設定 Java 17 環境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 使用 Maven 自動進行清理與打包（會產生 target/*.jar）
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. 登入 Docker Hub（選填，如果你未來想自動推送到 Docker Hub 可以加這段，目前先本地測試可略過或保留）
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. 利用我們寫好的 Dockerfile 建立 Docker Image
      - name: Build Docker Image
        run: docker build -t my-app:v1 .

      # 6. 測試執行 Docker 容器（確認包出來的 Image 可以正常跑起來）
      - name: Test Docker Container
        run: |
          docker run -d --name test-app -p 8080:8080 my-app:v1
          sleep 5 # 等待 5 秒讓 Spring Boot 啟動
          curl http://localhost:8080/ || exit 1 # 測試能不能順利連線