name: Java CI and Publish to Docker Hub

on:
  push:
    branches: [ "main" ] # 或 master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 1. 登入 Docker Hub (使用剛剛在 GitHub 設定的 Secrets)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 2. 建立 Docker Image (注意這裡加上了你的 Docker Hub 帳號作為前綴)
      - name: Build Docker Image
        run: docker build -t 你的DockerHub帳號/my-app:v1 .

      # 3. 測試執行容器
      - name: Test Docker Container
        run: |
          docker run -d --name test-app -p 8080:8080 你的DockerHub帳號/my-app:v1
          sleep 5
          curl http://localhost:8080/ || exit 1

      # 4. 自動推送到 Docker Hub 雲端
      - name: Push Docker Image to Docker Hub
        run: docker push 你的DockerHub帳號/my-app:v1